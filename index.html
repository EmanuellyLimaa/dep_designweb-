<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Aula 06: JS Orientado a Objetos </title>
</head>
<body>

    <h1> Repositório para Disciplina de Design Web </h1>
    <h2> Data: 21/10/2026 </h2>
    <table>
        <tr>
            <th> Objetos: </th>
            <th> Ações: </th>
        </tr>

        <tr>
            <td> Balu </td>
            <td>
                <button onclick="balu.falar()"> Falar </button>
                <button onclick="balu.comer(0.5)"> Comer </button>

                <button onclick="balu.saudar()"> Saudar </button>
            </td>
        <tr>

        <tr>
            <td> Mel </td>
            <td>
                <button onclick="mel.falar()"> Falar </button>
                <button onclick="mel.comer(0.8)"> Comer </button>
                <button onclick="mel.cagar(0.4)"> Cagar </button>
                <button onclick="mel.saudar()"> Saudar </button>
            </td>
        </tr>

        <tr>
            <td> Leleco </td>
            <td>
                <button onclick="leleco.falar()"> Falar </button>
                <button onclick="leleco.comer(0.05)"> Comer </button>
                <button onclick="leleco.cagar(0.02)"> Cagar </button>
                <button onclick="leleco.saudar()"> Saudar </button>
            </td>
        </tr>

        <tr>
            <td> Priscila </td>
            <td>
                <button onclick="priscila.falar()"> Falar </button>
                <button onclick="priscila.comer(0.08)"> Comer </button>

                <button onclick="priscila.saudar()"> Saudar </button>
            </td>
        <tr>
    </table>

    <script src="./JS/script02.js"></script>

</body>
</html>
